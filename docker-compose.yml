services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-cms-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: ai_headless_cms
    volumes:
      - cms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d ai_headless_cms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cms_pg_data:
